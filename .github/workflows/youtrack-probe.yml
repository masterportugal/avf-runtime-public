name: AVF YouTrack public API probe

on:
  push:
    paths:
      - ".youtrack-probe"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official public YouTrack API
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          from pathlib import Path

          def get(url):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"avf-public-runtime/youtrack-probe"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(1000000).decode("utf-8","replace")
                      return {"status_code":r.status,"body":body}
              except urllib.error.HTTPError as e:
                  return {"status_code":e.code,"body":e.read(100000).decode("utf-8","replace")}
              except Exception as e:
                  return {"status_code":0,"error":type(e).__name__+":"+str(e)}

          issue_url="https://youtrack.jetbrains.com/api/issues/IDEA-312383?fields=idReadable,summary,created,updated,tags(name)"
          query=urllib.parse.quote("tag: plugin-welcome")
          list_url=f"https://youtrack.jetbrains.com/api/issues?query={query}&fields=idReadable,summary,created,updated,tags(name)&$top=10"
          a=get(issue_url); b=get(list_url)
          out={
            "issue_probe_status":a.get("status_code"),
            "query_probe_status":b.get("status_code"),
            "issue_json":None,
            "query_count":None,
            "query_sample":[],
          }
          try:
              out["issue_json"]=json.loads(a.get("body","")) if a.get("status_code")==200 else None
          except Exception: pass
          try:
              rows=json.loads(b.get("body","")) if b.get("status_code")==200 else []
              if isinstance(rows,list):
                  out["query_count"]=len(rows)
                  out["query_sample"]=rows[:5]
          except Exception: pass
          Path("runtime_state").mkdir(exist_ok=True)
          Path("runtime_state/youtrack_probe.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Persist probe result
        shell: bash
        run: |
          git config user.name "avf-runtime-bot"
          git config user.email "avf-runtime-bot@users.noreply.github.com"
          git add runtime_state/youtrack_probe.json
          git commit -m "runtime: persist YouTrack public API probe" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
