name: AVF recurrent discovery

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".bootstrap-run"

permissions:
  contents: write

concurrency:
  group: avf-recurrent-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize before work
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          echo "CANONICAL_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal AVF runtime
        run: python -m pip install .
      - name: Run recurrent discovery
        run: python -m avf.runtime_job --root . --state-dir runtime_state
      - name: Persist durable state without overwriting newer work
        shell: bash
        run: |
          if git diff --quiet -- runtime_state && [ -z "$(git status --porcelain -- runtime_state)" ]; then
            echo "No durable-state changes to persist."
            exit 0
          fi
          git config user.name "avf-runtime-bot"
          git config user.email "avf-runtime-bot@users.noreply.github.com"
          git add runtime_state
          git commit -m "runtime: persist recurrent discovery state"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "Canonical state changed with a conflict. Refusing to overwrite newer work."
            exit 75
          fi
          git push origin HEAD:main
